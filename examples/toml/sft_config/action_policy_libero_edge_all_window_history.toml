# E003-WINDOW: bounded native sliding-window history control.
# The last H=16 completed observations are passed as full-spatial single-frame
# causal VAE latents plus their executed actions. No visual96 pooling, GRU, or
# Local token is used. The final WAM item remains current-clean/future-noised.
# Native forward packs 16 samples; GA=128 preserves 2048 consumers/update.\n# Formal comparison checkpoint: iter_000002800.

[job]
task       = "vfm"
experiment = "action_policy_libero_edge_all"
project    = "cosmos3_action_libero"
group      = "action_sft"
name       = "edge_libero_4in1_window_history_h16"
wandb_mode = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [200]

[trainer]
max_iter        = 2800
logging_iter    = 1
grad_accum_iter = 128

[trainer.cudnn]
benchmark = false

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 50
